# Links in the site header, in order.
#
# `match` (optional) also highlights the link on any page whose URL contains
# it, so individual paper pages under /publication/ light up "Publications".

main:
  - title: "Publications"
    url: /publications/
    match: /publication/

  - title: "Projects"
    url: /portfolio/
    match: /portfolio/

  - title: "CV"
    url: /cv/
